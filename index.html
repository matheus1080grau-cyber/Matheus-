<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meu Controle Estiva</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:#172033;font:15px Arial}.top{background:#111827;color:#fff;padding:16px;position:sticky;top:0}.topin,main{max-width:1100px;margin:auto}.topin{display:flex;justify-content:space-between;align-items:center}.wrap{padding:16px 10px 40px}.auth,.panel,.card{background:#fff;border:1px solid #dbe1e8;border-radius:15px;padding:16px;box-shadow:0 2px 8px #0000000b}.auth{max-width:600px;margin:7vh auto}.field{margin:10px 0}.field label{display:block;font-weight:bold;margin-bottom:5px;font-size:13px}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px}textarea{min-height:180px}.btn{border:0;border-radius:9px;padding:11px 15px;background:#111827;color:#fff;font-weight:bold}.secondary{background:#e8edf3;color:#172033}.danger{background:#b42318}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-bottom:14px}.metric{font-size:19px;font-weight:bold;margin-top:6px}.label{font-size:12px;color:#64748b;font-weight:bold}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:14px}.tab{padding:10px 14px;border:1px solid #dbe1e8;background:#fff;border-radius:9px;font-weight:bold;white-space:nowrap}.active{background:#111827;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:850px}.table td,.table th{padding:8px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:12px}.weeks{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.notice{padding:11px;background:#f5f7fa;border-radius:9px;color:#475569}.hidden{display:none}@media(max-width:800px){.cards{grid-template-columns:repeat(3,1fr)}.weeks{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.weeks{grid-template-columns:1fr}.auth{margin:3vh 5px}}
</style></head><body><div id="app"></div><script>
const K="meuControleEstiva_v1",C=["Moradia","Alimentação","Combustível","Internet","Saúde","Educação","Transporte","Lazer","Outros"],D={das:27,desconto:11,ficha:16,p13:8.33,ferias:11.11,limite:4000};let db=JSON.parse(localStorage.getItem(K)||'{"users":[],"cur":null}');const save=()=>localStorage.setItem(K,JSON.stringify(db)),U=()=>db.users.find(x=>x.id===db.cur),id=()=>Date.now()+Math.random(),esc=s=>String(s??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[x])),R=n=>(+n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}),N=v=>{let s=String(v||"").replace(/R\$\s?/g,"").trim();return s.includes(",")?+(s.replace(/\./g,"").replace(",","."))||0:/^\d{1,3}(\.\d{3})+$/.test(s)?+s.replace(/\./g,""): +s||0},MK=d=>String(d||"").slice(0,7);
function authPage(msg=""){app.innerHTML='<div class="auth"><h1>⚓ Meu Controle — Estiva</h1><p>Crie sua conta pela matrícula. Nenhum nome, matrícula ou senha fica fixo no aplicativo.</p><div class="field"><label>Nome completo</label><input id="nm"></div><div class="field"><label>Matrícula</label><input id="mt"></div><div class="field"><label>Senha</label><input id="pw" type="password"></div><div class="field"><label>Confirmar senha</label><input id="pw2" type="password"></div><button class="btn" style="width:100%" onclick="login()">CRIAR CONTA / ENTRAR</button>'+ (msg?'<p style="color:#a54b12">'+esc(msg)+'</p>':"")+'<p style="color:#64748b">Esta versão guarda os dados neste aparelho/navegador.</p></div>'}
function login(){let n=nm.value.trim(),m=mt.value.trim(),p=pw.value;if(!n||!m||!p)return authPage("Preencha os campos.");if(p!==pw2.value)return authPage("As senhas não conferem.");let u=db.users.find(x=>x.m===m);if(u&&u.p!==p)return authPage("Matrícula já cadastrada neste navegador e senha incorreta.");if(!u){u={id:id(),n,m,p,c:{...D},l:[],g:[]};db.users.push(u)}db.cur=u.id;save();render()}
function out(){db.cur=null;save();render()}
function sums(m){let u=U(),l=u.l.filter(x=>!m||MK(x.d)===m),g=u.g.filter(x=>!m||MK(x.d)===m),z=(k,a=l)=>a.reduce((t,x)=>t+(+x[k]||0),0),br=z("br"),li=z("li"),fi=z("fi"),ga=z("v",g),r13=br*u.c.p13/100,rf=br*u.c.ferias/100;return{l,g,br,li,fi,in:z("in"),das:z("das"),fg:z("fg"),ga,res:r13+rf,free:li-ga-r13-rf}}
function head(){let u=U();return '<div class="top"><div class="topin"><b>⚓ Meu Controle — Estiva</b><span>'+esc(u.n)+' <button class="btn secondary" onclick="out()">Sair</button></span></div></div>'}
function cards(s){return '<div class="cards">'+[["Dinheiro livre estimado",s.free],["Total bruto",s.br],["Líquido recebido",s.li],["Ficha 16%",s.fi],["Gastos",s.ga],["13º + férias",s.res]].map(x=>'<div class="card"><div class="label">'+x[0]+'</div><div class="metric">'+R(x[1])+'</div></div>').join("")+'</div>'}
function tabs(t){return '<div class="tabs">'+[["l","Lançamento"],["s","Semanas"],["m","Mês"],["r","Regras"]].map(x=>'<button class="tab '+(t==x[0]?"active":"")+'" onclick="tab(''+x[0]+'')">'+x[1]+'</button>').join("")+'</div>'}
function render(){if(!U())return authPage();app.innerHTML=head()+'<main class="wrap" id="ct"></main>';tab("l")}
function tab(t){let m=new Date().toISOString().slice(0,7),s=sums(m);ct.innerHTML=cards(s)+tabs(t)+(t=="l"?launch():t=="s"?weeks():t=="m"?month():rules())}
function launch(){return '<div class="panel"><h2>Novo lançamento</h2><p>Cole o recibo completo e analise.</p><textarea id="txt" placeholder="Cole aqui o recibo..."></textarea><div class="actions"><button class="btn" onclick="an()">Analisar</button></div></div><div id="result"></div>'+hist(new Date().toISOString().slice(0,7))}
function val(t,key){let r=new RegExp(key+'[^\\n]*?([\\d.]+,\\d{2})',"i").exec(t);return r?N(r[1]):0}
function an(){let t=txt.value,d=(t.match(/Data\s*Do\s*Pagamento\s*:\s*(\d{2}\/\d{2}\/\d{4})/i)||[])[1]||"",ds=d?d.split("/").reverse().join("-"):"";let per=(t.match(/Per[ií]odo[^\n]*?(\d{2}\s*[-/]\s*\d{2})/i)||[])[1]||"",br=val(t,"TOTAL\s+BRUTO")||val(t,"Bruto"),li=val(t,"TOTAL\s+LIQUIDO")||val(t,"Liquido"),ins=val(t,"INSS"),das=val(t,"DAS"),fg=val(t,"FGTS"),fi=br*U().c.ficha/100;result.innerHTML='<div class="panel"><h2>Conferir</h2><div class="grid">'+fld("pd","Data", "date",ds)+fld("pp","Período","text",per)+fld("ps","Semana","number",1)+fld("pb","Bruto","number",br)+fld("pl","Líquido","number",li)+fld("pf","Ficha","number",fi)+fld("pi","INSS","number",ins)+fld("pda","DAS","number",das)+fld("pg","FGTS","number",fg)+'</div><button class="btn" onclick="addL()">Salvar</button></div>'}
function fld(i,l,t,v){return '<div class="field"><label>'+l+'</label><input id="'+i+'" type="'+t+'" value="'+esc(v||"")+'" step=".01"></div>'}
function addL(){let u=U(),x={id:id(),d:pd.value,per:pp.value,s:+ps.value||1,br:N(pb.value),li:N(pl.value),fi:N(pf.value),in:N(pi.value),das:N(pda.value),fg:N(pg.value)};if(u.l.some(a=>a.d==x.d&&a.per==x.per&&a.br==x.br&&a.li==x.li&&a.das==x.das&&a.fi==x.fi))return alert("Recibo duplicado.");u.l.push(x);save();tab("l");alert("Salvo.")}
function hist(m){let l=U().l.filter(x=>MK(x.d)==m),rows=l.map(x=>'<tr><td>'+esc(x.d)+'</td><td>'+esc(x.per)+'</td><td>'+x.s+'</td><td>'+R(x.br)+'</td><td>'+R(x.li)+'</td><td>'+R(x.fi)+'</td><td>'+R(x.in)+'</td><td>'+R(x.das)+'</td><td>'+R(x.fg)+'</td><td><button class="btn secondary" onclick="editL('+x.id+')">Editar</button> <button class="btn danger" onclick="delL('+x.id+')">Excluir</button></td></tr>').join("");return '<div class="panel"><h2>Histórico — '+m+'</h2><div class="table"><table><tr><th>Data</th><th>Período</th><th>Semana</th><th>Bruto</th><th>Líquido</th><th>Ficha</th><th>INSS</th><th>DAS</th><th>FGTS</th><th>Ações</th></tr>'+ (rows||'<tr><td colspan="10">Nenhum lançamento.</td></tr>')+'</table></div></div>'}
function editL(i){let x=U().l.find(a=>a.id==i);if(!x)return;["d","per","s","br","li","fi","in","das","fg"].forEach(k=>{let v=prompt(k,x[k]);if(v!==null)x[k]=["br","li","fi","in","das","fg"].includes(k)?N(v):v});save();tab("l")}
function delL(i){if(confirm("Excluir?")){U().l=U().l.filter(x=>x.id!=i);save();tab("l")}}
function weeks(){let u=U(),m=new Date().toISOString().slice(0,7),o='<div class="panel"><h2>Semanas — '+m+'</h2><div class="weeks">';for(let w=1;w<=5;w++){let a=u.l.filter(x=>MK(x.d)==m&&+x.s==w),q=k=>a.reduce((t,x)=>t+(+x[k]||0),0);o+='<div class="card"><b>Semana '+w+'</b><p>Bruto: '+R(q("br"))+'</p><p>Líquido: '+R(q("li"))+'</p><p>Ficha: '+R(q("fi"))+'</p><p>INSS: '+R(q("in"))+'</p><p>DAS: '+R(q("das"))+'</p><p>FGTS: '+R(q("fg"))+'</p><b>Dinheiro livre: '+R(q("li"))+'</b></div>'}return o+'</div></div><div class="panel notice">2ª quarta = Semana 1 · 3ª = Semana 2 · 4ª = Semana 3 · 5ª = Semana 4. A semana pode ser editada manualmente.</div>'}
function month(){let m=new Date().toISOString().slice(0,7),s=sums(m);return '<div class="panel"><h2>Fechamento mensal</h2><input type="month" value="'+m+'" onchange="monthView(this.value)"><div class="grid">'+[["Bruto",s.br],["Líquido",s.li],["Ficha",s.fi],["13º + férias",s.res],["FGTS",s.fg],["Gastos",s.ga],["Dinheiro livre",s.free]].map(x=>'<div class="card"><div class="label">'+x[0]+'</div><div class="metric">'+R(x[1])+'</div></div>').join("")+'</div></div>'+gastos(m)}
function monthView(m){let s=sums(m);ct.innerHTML=cards(s)+tabs("m")+'<div class="panel"><h2>Fechamento '+m+'</h2><input type="month" value="'+m+'" onchange="monthView(this.value)"><div class="grid">'+[["Bruto",s.br],["Líquido",s.li],["Ficha",s.fi],["13º + férias",s.res],["FGTS",s.fg],["Gastos",s.ga],["Dinheiro livre",s.free]].map(x=>'<div class="card"><div class="label">'+x[0]+'</div><div class="metric">'+R(x[1])+'</div></div>').join("")+'</div></div>'+gastos(m)}
function gastos(m){let u=U(),gs=u.g.filter(x=>MK(x.d)==m);return '<div class="panel"><h2>Gastos</h2><div class="grid"><div class="field"><label>Data</label><input id="gd" type="date" value="'+m+'-01"></div><div class="field"><label>Descrição</label><input id="gx"></div><div class="field"><label>Categoria</label><select id="gc">'+C.map(x=>'<option>'+x+'</option>').join("")+'</select></div><div class="field"><label>Valor</label><input id="gv" type="number" step=".01"></div></div><button class="btn" onclick="addG()">Adicionar</button><p><b>Total: '+R(gs.reduce((a,x)=>a+x.v,0))+'</b></p><div class="table"><table><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Valor</th><th></th></tr>'+gs.map(x=>'<tr><td>'+x.d+'</td><td>'+esc(x.x)+'</td><td>'+esc(x.c)+'</td><td>'+R(x.v)+'</td><td><button class="btn danger" onclick="delG('+x.id+')">Excluir</button></td></tr>').join("")+'</table></div></div>'}
function addG(){if(!gd.value||!gx.value||!gv.value)return alert("Preencha os campos.");U().g.push({id:id(),d:gd.value,x:gx.value,c:gc.value,v:N(gv.value)});save();tab("m")}
function delG(i){U().g=U().g.filter(x=>x.id!=i);save();tab("m")}
function rules(){let c=U().c;return '<div class="panel"><h2>Regras</h2><div class="notice">O DAS do recibo é separado da provisão da Ficha. Ficha e FGTS nunca entram como dinheiro líquido recebido.</div><div class="grid">'+fld("rd","DAS total %","number",c.das)+fld("rx","Desconto %","number",c.desconto)+fld("rf","Ficha %","number",c.ficha)+fld("r13","13º %","number",c.p13)+fld("rv","Férias %","number",c.ferias)+fld("rl","Limite gastos","number",c.limite)+'</div><button class="btn" onclick="saveR()">Salvar regras</button></div><div class="panel"><b>Conta:</b> matrícula '+esc(U().m)+'<br><button class="btn danger" onclick="reset()">Apagar conta e dados</button></div>'}
function saveR(){let c=U().c;Object.assign(c,{das:N(rd.value),desconto:N(rx.value),ficha:N(rf.value),p13:N(r13.value),ferias:N(rv.value),limite:N(rl.value)});save();tab("r");alert("Salvo.")}
function reset(){if(confirm("Apagar conta e todos os dados?")){db.users=db.users.filter(x=>x.id!=db.cur);db.cur=null;save();render()}}
render();
</script></body></html>
